[package]
name = "bazaar-py"
version = { workspace = true }
edition = "2018"

[lib]
crate-type = ["cdylib"]

[dependencies]
bazaar = { path = "../bazaar", features = ["pyo3"] }
patiencediff = { workspace = true, default-features = false }
pyo3 = { workspace = true, features = ["extension-module", "chrono"] }
pyo3-filelike = { workspace = true }
pyo3-log = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
sha1 = { workspace = true }
vcs-graph = "3.5.0"
walkdir = "2"
indexmap = "2"

[features]
# Enable in-process OpenPGP commit signing (forwards to bazaar/gpg). Off by
# default so the Python extension does not pull in a crypto backend.
gpg = ["bazaar/gpg"]
