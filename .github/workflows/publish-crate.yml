---
name: Publish crate

"on":
  push:
    tags:
      - "bzrformats-*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish bazaar crate
        run: cargo publish -p bazaar --no-default-features
